[www]
user  = www-data
group = www-data

; Listen on TCP port 9000 — NGINX connects here via FastCGI
listen = 9000

; Dynamic process management: spawns/kills workers based on load
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass environment variables to PHP workers (needed for WP to read env vars)
clear_env = no
