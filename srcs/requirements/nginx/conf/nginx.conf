user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        # Only accept HTTPS — no plain HTTP port
        listen 443 ssl;
        server_name _;

        # Self-signed certificate generated at build time
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # Subject requirement: TLSv1.2 and TLSv1.3 only
        ssl_protocols TLSv1.2 TLSv1.3;

        # WordPress files live here (shared volume with wordpress container)
        root  /var/www/html;
        index index.php index.html;

        # WordPress URL routing: try the exact file, then directory, then
        # fall back to index.php (lets WordPress handle pretty permalinks)
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Pass all .php requests to php-fpm in the wordpress container
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Block access to .htaccess and other hidden files
        location ~ /\.ht {
            deny all;
        }
    }
}
